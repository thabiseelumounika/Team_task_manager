<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

<style>

body{
    background: linear-gradient(to right,#000000,#0f0f0f);
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    width:350px;
    background:#111;
    padding:40px;
    border-radius:15px;
    box-shadow:0px 0px 20px #00ff99;
}

h2{
    color:#00ff99;
    text-align:center;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#222;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:25px;
    background:#00ff99;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00cc77;
}

.flash{
    background:#222;
    color:#ff66cc;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
}

a{
    color:#ff66cc;
    text-decoration:none;
}

.bottom{
    text-align:center;
    margin-top:20px;
    color:white;
}

</style>

</head>

<body>

<div class="card">

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
    {% endif %}
{% endwith %}

<h2>Team Task Manager</h2>

<form method="POST">

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<div class="bottom">
Don't have account?
<a href="/signup">Signup</a>
<br><br>
<a href="/forgot_password">Forgot Password?</a>
</div>

</div>

</body>
</html>
