<!DOCTYPE html>
<html>
<head>
    <title>Create Task</title>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    font-family:Arial;
    color:white;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:50px;
}

.card{
    width:450px;
    background:#111;
    padding:40px;
    border-radius:15px;
    box-shadow:0px 0px 20px #ff66cc;
}

h2{
    text-align:center;
    color:#ff66cc;
    margin-bottom:30px;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#222;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#ff66cc;
    border:none;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff3399;
}

</style>

</head>

<body>

{% include 'navbar.html' %}

<div class="container">

<div class="card">

<h2>Create Task</h2>

<form method="POST">

<input
type="text"
name="title"
placeholder="Task Title"
required>

<select name="assigned_to">

{% for user in users %}

<option value="{{ user.username }}">
    {{ user.username }}
</option>

{% endfor %}

</select>

<select name="status">

<option value="Pending">
    Pending
</option>

<option value="In Progress">
    In Progress
</option>

<option value="Completed">
    Completed
</option>

</select>

<input
type="date"
name="due_date"
required>

<select name="project_id">

{% for project in projects %}

<option value="{{ project.id }}">
    {{ project.project_name }}
</option>

{% endfor %}

</select>

<button type="submit">
Create Task
</button>

</form>

</div>

</div>

</body>
</html>
